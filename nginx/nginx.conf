worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Le resolver 127.0.0.11 est le DNS interne de Docker.
  # "valid=10s" force Nginx a re-resoudre le nom "api-gateway" toutes les 10s
  # au lieu de le mettre en cache indefiniment. C'est ce qui permet a Nginx
  # de decouvrir automatiquement les nouvelles repliques quand on scale
  # le service api-gateway, et de repartir le trafic entre elles.
  resolver 127.0.0.11 valid=10s;

  log_format lb_log '$remote_addr - [$time_local] "$request" $status '
                     'upstream=$upstream_addr rt=$request_time';

  access_log /dev/stdout lb_log;

  server {
    listen 80;

    location / {
      set $upstream http://api-gateway:3000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }
}
