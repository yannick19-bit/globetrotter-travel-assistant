services:
  mysql:
    image: mysql:8.0
    container_name: globetrotter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: touopi1983
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptouopi1983"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Nouveau en Phase 4 : sert a la fois de cache (destination-service) et
  # de backend pour la file de messages (itinerary-service + worker).
  redis:
    image: redis:7-alpine
    container_name: globetrotter-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: touopi1983
      DB_NAME: auth_db
      JWT_SECRET: globetrotter_shared_secret_docker
      JWT_EXPIRES_IN: 24h
    depends_on:
      mysql:
        condition: service_healthy

  destination-service:
    build: ./destination-service
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: touopi1983
      DB_NAME: destination_db
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  itinerary-service:
    build: ./itinerary-service
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: touopi1983
      DB_NAME: itinerary_db
      JWT_SECRET: globetrotter_shared_secret_docker
      DESTINATION_SERVICE_URL: http://destination-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      destination-service:
        condition: service_started
      auth-service:
        condition: service_started

  # Nouveau en Phase 4 : processus separe qui consomme la file
  # "itinerary-events". Meme image que itinerary-service, juste une
  # commande de demarrage differente.
  itinerary-worker:
    build: ./itinerary-service
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      DESTINATION_SERVICE_URL: http://destination-service:3002
      ITINERARY_SERVICE_URL: http://itinerary-service:3003
    depends_on:
      - auth-service
      - destination-service
      - itinerary-service

  nginx:
    image: nginx:alpine
    container_name: globetrotter-lb
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mysql-data:
